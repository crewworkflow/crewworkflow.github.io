<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://crewflow-api.akhlaq.cloud; form-action https://crewflow-api.akhlaq.cloud; base-uri 'none'; frame-ancestors 'none'" />
<meta name="robots" content="noindex,nofollow" />
<title>Quote for approval</title>
<style>
:root{color-scheme:light;--ink:#10203a;--muted:#637083;--blue:#1264d8;--paper:#fff;--wash:#f3f7fc;--line:#dfe7f1;--green:#16794b;--red:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:760px;margin:auto;padding:28px 18px 48px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px #17365d14;overflow:hidden}.hero{padding:30px;background:linear-gradient(135deg,#0d4ca8,#1685df);color:white}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:14px 0 8px}.hero p{margin:0;opacity:.88}.content{padding:26px}table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:15px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}td:last-child,th:last-child{text-align:right}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding-top:12px}.actions{display:grid;gap:12px;margin:22px 0}.actions form{display:grid;gap:12px}label{display:grid;gap:6px;font-weight:650}input{width:100%;border:1px solid #bdc9d8;border-radius:10px;padding:12px;font:inherit}.button,button{appearance:none;border:0;border-radius:12px;padding:13px 18px;color:white;text-decoration:none;font:inherit;font-weight:700;cursor:pointer;width:100%}.primary{background:var(--green)}.secondary{background:#e9f2ff;color:#064fae}.fine{color:var(--muted);font-size:13px}.options{display:grid;gap:10px;margin:8px 0 4px}.option{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--paper);cursor:pointer;font:inherit;color:inherit}.option .name{font-weight:800}.option .scope{color:var(--muted);font-size:14px;margin-top:2px}.option .price{font-weight:800;font-size:18px;margin-top:6px}.option.selected{border-color:var(--green);background:#f2faf5;outline:2px solid var(--green)}
.decision{display:flex;gap:14px;align-items:center;padding:18px;border-radius:16px;border:1px solid var(--line)}.decision.approved{background:#edf9f2;border-color:#b9e4ca;color:#125d3b}.decision.declined{background:#fdecea;border-color:#f3c1bc;color:var(--red)}.seal{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;color:white;font-size:22px}.approved .seal{background:var(--green)}.declined .seal{background:var(--red)}.contact{margin-top:18px;color:var(--muted);font-size:14px}.expiry{color:var(--muted);font-size:13px;margin-top:18px}.state{padding:60px 20px;text-align:center;color:var(--muted)}@media(max-width:650px){.wrap{padding:0}.card{border:0;border-radius:0}.hero,.content{padding:24px}}
</style>
</head>
<body>
<main class="wrap"><article class="card" id="app"><div class="state">Loading…</div></article></main>
<script src="app.js"></script>
</body>
</html>
