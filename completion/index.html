<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self' https://crewflow-api.akhlaq.cloud; style-src 'unsafe-inline'; connect-src https://crewflow-api.akhlaq.cloud; form-action https://crewflow-api.akhlaq.cloud; base-uri 'none'; frame-ancestors 'none'" />
<meta name="robots" content="noindex,nofollow" />
<title>Project completion</title>
<style>
:root{color-scheme:light;--ink:#10203a;--muted:#637083;--blue:#1264d8;--paper:#fff;--wash:#f3f7fc;--line:#dfe7f1;--green:#16794b}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:980px;margin:auto;padding:28px 18px 48px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px #17365d14;overflow:hidden}.hero{padding:34px;background:linear-gradient(135deg,#0d4ca8,#1685df);color:white}.brand{display:flex;align-items:center;gap:14px}.logo{width:56px;height:56px;object-fit:contain;background:white;border-radius:14px;padding:5px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}h1{font-size:clamp(30px,6vw,52px);line-height:1.05;margin:22px 0 10px}h2{font-size:22px;margin:0 0 10px}.hero p{margin:0;opacity:.88}.content{padding:30px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:4px 0 32px}.photo{position:relative;min-height:300px;margin:0;background:#dbe5f1;border-radius:16px;overflow:hidden}.photo img{width:100%;height:100%;position:absolute;object-fit:cover}.tag{position:absolute;left:12px;top:12px;background:#101c2dcc;color:white;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.08em}.scope{white-space:pre-wrap;font-size:17px}.meta{display:flex;gap:22px;flex-wrap:wrap;padding:18px 0 28px;color:var(--muted);font-size:14px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0}.review{display:block;margin-top:12px;text-align:center;background:#e6f4ea;color:#137333}.button,button{appearance:none;border:0;border-radius:12px;padding:13px 18px;background:var(--blue);color:white;text-decoration:none;font:inherit;font-weight:700;cursor:pointer}.secondary{background:#e9f2ff;color:#064fae}.approval{margin-top:28px;padding:24px;border:1px solid var(--line);border-radius:16px;background:#f9fbfe}.approval p{color:var(--muted)}label{display:grid;gap:7px;font-weight:650}input{width:100%;border:1px solid #bdc9d8;border-radius:10px;padding:12px;font:inherit;margin-bottom:14px}.approved{display:flex;gap:14px;align-items:center;background:#edf9f2;border-color:#b9e4ca;color:#125d3b;border:1px solid #b9e4ca;border-radius:16px;padding:24px;margin-top:28px}.seal{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;background:var(--green);color:white;font-size:24px}.powered{text-align:center;color:var(--muted);font-size:13px;padding:22px}.warranty{margin-top:16px;color:var(--muted);font-size:14px}.state{padding:60px 20px;text-align:center;color:var(--muted)}@media(max-width:650px){.wrap{padding:0}.card{border:0;border-radius:0}.hero,.content{padding:24px}.photos{grid-template-columns:1fr}.photo{min-height:260px}}
</style>
</head>
<body>
<main class="wrap"><article class="card" id="app"><div class="state">Loading…</div></article></main>
<script src="app.js"></script>
</body>
</html>
