<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src https://crewflow-api.akhlaq.cloud; base-uri 'none'; frame-ancestors 'none'" />
<meta name="robots" content="noindex,nofollow" />
<title>CrewFlow Ops — sync issues</title>
<style>
:root{color-scheme:light;--ink:#10203a;--muted:#637083;--blue:#1264d8;--paper:#fff;--wash:#f3f7fc;--line:#dfe7f1;--green:#16794b;--red:#b3261e;--amber:#8a5a00}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:980px;margin:auto;padding:28px 18px 64px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px #17365d14;overflow:hidden}.hero{padding:26px;background:linear-gradient(135deg,#0d4ca8,#1685df);color:white}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}h1{font-size:clamp(22px,4.4vw,32px);line-height:1.15;margin:10px 0 6px}.hero p{margin:0;opacity:.88;font-size:14px}.content{padding:22px}label{display:grid;gap:6px;font-weight:650;font-size:14px}input,select{width:100%;border:1px solid #bdc9d8;border-radius:10px;padding:12px;font:inherit;background:white;color:var(--ink)}button{appearance:none;border:0;border-radius:12px;padding:13px 18px;color:white;font:inherit;font-weight:700;cursor:pointer;width:100%}.primary{background:var(--green)}.secondary{background:#e9f2ff;color:#064fae}.ghost{background:transparent;color:var(--blue);border:1px solid #b9d4f5}.fine{color:var(--muted);font-size:13px}.state{padding:60px 20px;text-align:center;color:var(--muted)}.gate{display:grid;gap:14px;max-width:460px;margin:40px auto;padding:26px}.checkline{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}.checkline input{width:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}.stat{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--paper)}.stat b{display:block;font-size:22px}.stat span{color:var(--muted);font-size:12.5px}.filters{display:grid;grid-template-columns:1fr 150px auto;gap:10px;align-items:end;margin-bottom:14px}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters .wide{grid-column:1/-1}}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar button{width:auto;padding:10px 14px;font-size:14px}.event{border:1px solid var(--line);border-radius:14px;margin-bottom:10px;background:var(--paper);overflow:hidden}.event summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;list-style:none}.event summary::-webkit-details-marker{display:none}.badge{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:8px;padding:3px 8px;color:white;background:var(--muted)}.badge.error{background:var(--red)}.badge.warning{background:var(--amber)}.badge.info{background:var(--blue)}.badge.critical{background:#6d1a12}.code{font-weight:700;font-size:14px;word-break:break-all}.when{color:var(--muted);font-size:12.5px;white-space:nowrap}.detail{padding:0 14px 14px;border-top:1px solid var(--line)}.detail dl{display:grid;grid-template-columns:150px 1fr;gap:4px 10px;margin:12px 0;font-size:13.5px}.detail dt{color:var(--muted)}.detail dd{margin:0;word-break:break-all}.msg{background:#f6f9fd;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:10px 0;white-space:pre-wrap;word-break:break-word}.rowbtn{background:#e9f2ff;color:#064fae;width:auto;padding:8px 12px;font-size:13px}.ok{color:var(--green)}.err{color:var(--red)}.empty{padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<main class="wrap"><article class="card" id="app"><div class="state">Loading…</div></article></main>
<script src="app.js"></script>
</body>
</html>
