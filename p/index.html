<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self' https://crewflow-api.akhlaq.cloud; style-src 'unsafe-inline'; connect-src https://crewflow-api.akhlaq.cloud; base-uri 'none'; frame-ancestors 'none'" />
<meta name="robots" content="noindex,nofollow" />
<title>Portfolio</title>
<style>
:root{color-scheme:light;--ink:#10203a;--muted:#637083;--blue:#1264d8;--paper:#fff;--wash:#f3f7fc;--line:#dfe7f1;--green:#16794b}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}.wrap{max-width:980px;margin:auto;padding:28px 18px 48px}.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 14px 40px #17365d14;overflow:hidden}.hero{padding:34px;background:linear-gradient(135deg,#0d4ca8,#1685df);color:white}.logo{width:56px;height:56px;object-fit:contain;background:white;border-radius:14px;padding:5px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:14px 0 8px}h2{font-size:20px;margin:0 0 10px}.hero p{margin:0;opacity:.88}.brand{display:flex;align-items:center;gap:14px;margin-bottom:8px}.content{padding:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}.project{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.photos{display:grid;grid-template-columns:1fr 1fr;gap:2px}.photo{position:relative;min-height:170px;margin:0;background:#dbe5f1;overflow:hidden}.photo img{width:100%;height:100%;position:absolute;object-fit:cover}.tag{position:absolute;left:10px;top:10px;background:#101c2dcc;color:white;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.08em}.project .body{padding:14px 16px}.project .when{color:var(--muted);font-size:13px}.review{display:block;margin-top:26px;text-align:center;background:#e6f4ea;color:#137333;padding:13px 18px;border-radius:12px;text-decoration:none;font-weight:700}.state{padding:60px 20px;text-align:center;color:var(--muted)}.powered{text-align:center;color:var(--muted);font-size:13px;padding:22px}@media(max-width:650px){.wrap{padding:0}.card{border:0;border-radius:0}.hero,.content{padding:24px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap"><article class="card" id="app"><div class="state">Loading…</div></article></main>
<script src="app.js"></script>
</body>
</html>
